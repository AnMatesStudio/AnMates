# Default values — meant to be overridden by values-prod.yaml.
# `helm lint` / `helm template` must pass with just this file (no cluster needed).

image:
  registry: ghcr.io
  owner: CHANGE_ME_github_owner # ví dụ: anmates-studio (chủ repo GitHub)
  pullPolicy: IfNotPresent
  api:
    repository: anmates-api
    tag: latest
  web:
    repository: anmates-web
    tag: latest

# Secret tạo thủ công (xem plan H3):
#   kubectl -n anmates create secret docker-registry ghcr-pull ...
imagePullSecrets:
  - name: ghcr-pull

api:
  # CHỈ có tác dụng khi api.hpa.enabled=false — bật HPA thì template bỏ hẳn
  # field spec.replicas và HPA sở hữu replica count.
  # Scale >1 đòi hỏi REDIS_URL có trong Secret `anmates-api`, nếu không mỗi
  # replica giữ một in-process hub riêng và WebSocket broadcast không xuyên pod.
  replicaCount: 1
  # Truyền vào pod web qua env API_UPSTREAM (web-deployment.yaml) — nginx.conf KHÔNG
  # còn hardcode tên này nữa (nó mặc định tên service "api" của docker compose).
  serviceName: anmates-api
  service:
    port: 8080
    namespace: anmates
  # Bí danh secret tạo thủ công chứa DATABASE_URL, REDIS_URL, JWT_SECRET,
  # FIREBASE_WEB_API_KEY, SMTP_PASSWORD, DEV_BYPASS_SECRET, ...
  #
  # REDIS_URL bật Redis pub/sub backplane cho WebSocket (ws.NewBackplane).
  # Không có key đó trong secret = in-process Hub = phải giữ replicaCount 1 và
  # api.hpa.enabled false. Chart KHÔNG kiểm tra được điều này — xem log startup
  # "ws backplane: redis pub/sub" để xác nhận.
  secretName: anmates-api
  env:
    # GOMAXPROCS/GOMEMLIMIT đè giá trị hardcode cho Cloud Run 1 vCPU trong Dockerfile.
    # GOMAXPROCS=1 khớp cpu limit "1" bên dưới; GOMEMLIMIT để dưới memory limit ~60Mi
    # làm khoảng đệm cho phần ngoài heap (goroutine stack, cgo, v.v.).
    goMaxProcs: "1"
    goMemLimit: "450MiB"
    devMode: "true" # bật /auth/dev-login (tester quick-login) — tắt khi có user thật
  probe:
    path: /health # đã tự ping DB — dùng chung cho liveness lẫn readiness
    initialDelaySeconds: 5
    periodSeconds: 10
  # Prometheus scrape — cần Prometheus Operator trong cụm (chart observability
  # ở repo anmates-infra). Bật lên khi observability đã chạy, nếu không
  # `helm install` sẽ lỗi "no matches for kind ServiceMonitor".
  metrics:
    enabled: false
    path: /metrics # middleware.Metrics; nginx của pod web KHÔNG proxy path này ra ngoài
    interval: 30s
    scrapeTimeout: 10s
  # HPA custom metrics. Mặc định TẮT ở MVP.
  # PRECONDITION: REDIS_URL phải có trong Secret `anmates-api`. Không có nó,
  # ws.NewBackplane trả in-process Hub và mọi replica thứ 2 trở đi sẽ không
  # nhận được WebSocket broadcast — mất message im lặng, không log, không error.
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    cpu:
      enabled: true # đặt false nếu cụm chưa có metrics-server (kubectl top nodes)
      # HPA tính utilization theo `requests`, KHÔNG theo `limits`. Ở đây
      # requests.cpu=100m còn limits.cpu=1 — tỉ lệ 1:10. Nên mốc 80 (mặc định
      # quen thuộc) thực chất là 80m CPU: pod xử lý traffic thật vượt qua trong
      # tích tắc rồi ở lì trên ngưỡng, HPA scale tới maxReplicas và không xuống.
      #
      # 200 = 200m CPU = 20% năng lực của một pod (GOMAXPROCS=1). Vẫn là con số
      # ƯỚC LƯỢNG như averageValue bên dưới — hiệu chỉnh sau khi đo bằng k6.
      # Cách sạch hơn về lâu dài: nâng requests.cpu lên sát mức dùng thật rồi
      # đưa averageUtilization về khoảng 70-80.
      averageUtilization: 200
    requestsPerSecond:
      # Tên do prometheus-adapter sinh ra: http_requests_total -> http_requests_per_second.
      metricName: http_requests_per_second
      # 20 req/s mỗi pod. Đổi số này sau khi đo bằng load-test/k6-script.js —
      # đừng đoán.
      averageValue: "20"
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
    limits:
      cpu: "1"
      memory: 512Mi

web:
  replicaCount: 2
  serviceName: anmates-web
  service:
    port: 80
    namespace: anmates
  probe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
