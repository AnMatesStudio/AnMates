apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.serviceName }}
  labels:
    app: {{ .Values.api.serviceName }}
    app.kubernetes.io/part-of: anmates
spec:
  {{- if not .Values.api.hpa.enabled }}
  # BỎ HẲN field `replicas` khi HPA bật — không phải đặt giá trị khác.
  # Helm ghi spec.replicas ở MỌI `helm upgrade`; HPA thấy số bị đặt lại sẽ
  # chỉnh về mức nó tính -> mỗi lần deploy là một vòng scale-down rồi scale-up.
  # Vắng field này thì Deployment giữ nguyên replica count do HPA quản lý.
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.api.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.api.serviceName }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.image.owner }}/{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GOMAXPROCS
              value: {{ .Values.api.env.goMaxProcs | quote }}
            - name: GOMEMLIMIT
              value: {{ .Values.api.env.goMemLimit | quote }}
            - name: DEV_MODE
              value: {{ .Values.api.env.devMode | quote }}
          # DATABASE_URL, REDIS_URL, JWT_SECRET, FIREBASE_WEB_API_KEY,
          # SMTP_PASSWORD, DEV_BYPASS_SECRET, ... — tạo thủ công (xem plan H3),
          # KHÔNG nhúng giá trị vào chart.
          #
          # REDIS_URL là connection string có credential nên nằm chung ở đây với
          # DATABASE_URL, không tách thành secretKeyRef riêng.
          #   redis://:<password>@anmates-redis.anmates.svc.cluster.local:6379/0
          # Vắng mặt REDIS_URL = ws.NewBackplane trả in-process Hub -> api KHÔNG
          # được scale quá 1 replica (api.hpa.enabled phải giữ false).
          envFrom:
            - secretRef:
                name: {{ .Values.api.secretName }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probe.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.probe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probe.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
