apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.api.serviceName }}
  labels:
    app: {{ .Values.api.serviceName }}
    app.kubernetes.io/part-of: anmates
spec:
  {{- if not .Values.api.hpa.enabled }}
  # BỎ HẲN field `replicas` khi HPA bật — không phải đặt giá trị khác.
  # Helm ghi spec.replicas ở MỌI `helm upgrade`; HPA thấy số bị đặt lại sẽ
  # chỉnh về mức nó tính -> mỗi lần deploy là một vòng scale-down rồi scale-up.
  # Vắng field này thì Deployment giữ nguyên replica count do HPA quản lý.
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.api.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.api.serviceName }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.image.owner }}/{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GOMAXPROCS
              value: {{ .Values.api.env.goMaxProcs | quote }}
            - name: GOMEMLIMIT
              value: {{ .Values.api.env.goMemLimit | quote }}
            - name: DEV_MODE
              value: {{ .Values.api.env.devMode | quote }}
            {{- if .Values.api.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.api.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.api.otel.protocol | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.api.otel.serviceName | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.api.otel.sampler | quote }}
            # Downward API: k8sattributes của Alloy có HAI pod_association rule.
            # Rule đọc resource attribute chạy trước và bền hơn rule theo
            # source IP — IP bị rewrite ở đâu đó là rule kia hỏng im lặng.
            #
            # $(VAR) là cú pháp expand của KUBERNETES, không phải shell: chỉ chạy
            # khi VAR đã khai báo TRƯỚC trong cùng danh sách env — đừng đảo thứ tự.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace={{ .Values.api.otel.serviceNamespace }},service.version={{ .Values.image.api.tag }},deployment.environment={{ .Values.api.otel.environment }},k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.node.name=$(K8S_NODE_NAME)"
            {{- end }}
          # DATABASE_URL, REDIS_URL, JWT_SECRET, FIREBASE_WEB_API_KEY,
          # SMTP_PASSWORD, DEV_BYPASS_SECRET, ... — tạo thủ công (xem plan H3),
          # KHÔNG nhúng giá trị vào chart.
          #
          # REDIS_URL là connection string có credential nên nằm chung ở đây với
          # DATABASE_URL, không tách thành secretKeyRef riêng.
          #   redis://:<password>@anmates-redis.anmates.svc.cluster.local:6379/0
          # Vắng mặt REDIS_URL = ws.NewBackplane trả in-process Hub -> api KHÔNG
          # được scale quá 1 replica (api.hpa.enabled phải giữ false).
          envFrom:
            - secretRef:
                name: {{ .Values.api.secretName }}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probe.path }}
              port: http
            initialDelaySeconds: {{ .Values.api.probe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probe.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probe.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
