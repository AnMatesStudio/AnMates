# Overrides cho môi trường production duy nhất (MVP 1 ngày — chưa có ns dev).
# Dùng: helm upgrade --install anmates ./deploy/charts/anmates \
#         -n anmates -f values-prod.yaml --set image.tag=<sha> --atomic --wait --timeout 10m
#
# LƯU Ý: image.tag KHÔNG đặt cố định ở đây — CI truyền qua --set image.api.tag=<sha>
# --set image.web.tag=<sha> (workflow ci.yml in sẵn lệnh này ở job cuối).

image:
  owner: CHANGE_ME_github_owner # sửa thành owner GitHub thật trước khi deploy

api:
  replicaCount: 1
  # Bật scrape sau khi chart observability (repo anmates-infra) đã chạy và CRD
  # ServiceMonitor tồn tại. Kiểm tra: kubectl get crd servicemonitors.monitoring.coreos.com
  metrics:
    enabled: true
  # HPA BẬT từ 2026-09-07 (observability + Redis backplane đã lên).
  #
  # Khi enabled=true, template BỎ HẲN spec.replicas -> api.replicaCount không
  # còn tác dụng, HPA sở hữu replica count.
  #
  # HAI con số dưới đây vẫn là ƯỚC LƯỢNG, chưa đo:
  #   averageValue 20 req/s/pod, averageUtilization 200 (=200m CPU)
  # Hiệu chỉnh bằng load-test/k6-script.js rồi --set lại, lấy ~70% mức bão hoà.
  #
  # cpu.enabled=true cần metrics-server. Chưa có thì `kubectl top nodes` lỗi ->
  # phải --set api.hpa.cpu.enabled=false, nếu không metric CPU không đọc được
  # sẽ chặn scale-down của cả HPA.
  hpa:
    enabled: true

web:
  replicaCount: 2
