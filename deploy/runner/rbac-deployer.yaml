# Identity the CD workflow uses: `helm upgrade` of release `anmates` in ns
# `anmates`, nothing else. Applied by scripts/make-deployer-kubeconfig.sh.
#
# The identity (ServiceAccount + token) lives in ns `ci-cd`, apart from the app.
# The Role/RoleBinding must stay in `anmates`: a Role only grants access inside
# its own namespace, and a RoleBinding may name a ServiceAccount from another one.
#
# Namespace-scoped on purpose — the runner container is reachable by workflow
# code, so its kubeconfig must not be cluster-admin. It CAN read Secrets in
# `anmates` (Helm stores release state in Secrets; the pre-flight checks that
# ghcr-pull / anmates-api exist).
apiVersion: v1
kind: Namespace
metadata:
  name: ci-cd
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: ci-cd
---
apiVersion: v1
kind: Secret
metadata:
  name: ci-deployer-token
  namespace: ci-cd
  annotations:
    kubernetes.io/service-account.name: ci-deployer
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-deployer
  namespace: anmates
rules:
  # Everything the anmates chart renders (Deployment, Service, HPA,
  # ServiceMonitor) plus what helm --wait / rollback and the smoke exec touch.
  - apiGroups: ["", apps, autoscaling, policy, batch, networking.k8s.io, monitoring.coreos.com]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer
  namespace: anmates
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-deployer
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: ci-cd
