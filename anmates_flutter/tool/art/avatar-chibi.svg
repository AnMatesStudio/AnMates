<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#dff5c8"/>
      <stop offset="1" stop-color="#a9dc86"/>
    </radialGradient>
    <radialGradient id="skin" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ffe9dc"/>
      <stop offset="1" stop-color="#fbd2bd"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f3b"/>
      <stop offset="1" stop-color="#1c1620"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#8a5a3c"/>
      <stop offset="0.55" stop-color="#4a2a1c"/>
      <stop offset="1" stop-color="#1e110c"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fa3"/>
      <stop offset="1" stop-color="#f0607e"/>
    </linearGradient>
    <clipPath id="round"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- sparkles -->
    <g fill="#ffffff" opacity="0.8">
      <path d="M70 110 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
      <path d="M440 90 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z"/>
      <path d="M455 300 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    </g>

    <!-- hair, back layer: long straight to the shoulders -->
    <path d="M86 250 C70 120 160 52 256 52 C352 52 442 120 426 250 L446 470 L360 470 L352 330 L160 330 L152 470 L66 470 Z" fill="url(#hair)"/>

    <!-- body: white top with red stripes -->
    <path d="M128 512 C130 440 180 402 256 402 C332 402 382 440 384 512 Z" fill="#ffffff"/>
    <path d="M156 460 C190 470 210 500 214 512 L196 512 C190 496 172 478 150 472 Z" fill="#e8403f"/>
    <path d="M356 460 C322 470 302 500 298 512 L316 512 C322 496 340 478 362 472 Z" fill="#e8403f"/>
    <path d="M200 406 C220 424 292 424 312 406" fill="none" stroke="#e8403f" stroke-width="8" stroke-linecap="round"/>
    <path d="M206 404 C224 418 288 418 306 404" fill="none" stroke="#f3d7d2" stroke-width="4" stroke-dasharray="3 5"/>

    <!-- neck -->
    <path d="M226 372 L286 372 L284 408 C270 416 242 416 228 408 Z" fill="#f6c7b0"/>

    <!-- face: big and round, chubby cheeks -->
    <path d="M104 236 C104 150 176 110 256 110 C336 110 408 150 408 236 C412 300 392 344 350 368 C322 384 290 388 256 388 C222 388 190 384 162 368 C120 344 100 300 104 236 Z" fill="url(#skin)"/>

    <!-- blush -->
    <ellipse cx="160" cy="298" rx="38" ry="22" fill="#ff9aa8" opacity="0.55"/>
    <ellipse cx="352" cy="298" rx="38" ry="22" fill="#ff9aa8" opacity="0.55"/>
    <g stroke="#ff7b8e" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <path d="M144 294 l8 -8 M158 298 l8 -8 M172 302 l8 -8"/>
      <path d="M336 302 l8 -8 M350 298 l8 -8 M364 294 l8 -8"/>
    </g>

    <!-- eyes: big anime eyes, a little squinty and happy like the photo -->
    <g transform="translate(195 246) scale(1.28) translate(-195 -236)">
      <path d="M160 238 C168 206 214 200 228 232 C222 262 170 266 160 238 Z" fill="#ffffff"/>
      <ellipse cx="195" cy="236" rx="25" ry="24" fill="url(#iris)"/>
      <ellipse cx="195" cy="240" rx="12" ry="13" fill="#140b08"/>
      <circle cx="185" cy="226" r="8" fill="#ffffff"/>
      <circle cx="204" cy="248" r="4" fill="#ffffff" opacity="0.9"/>
      <path d="M156 234 C172 210 212 206 230 226" fill="none" stroke="#1c1620" stroke-width="5" stroke-linecap="round"/>
      <path d="M226 222 l10 -3" stroke="#1c1620" stroke-width="5" stroke-linecap="round"/>
      <path d="M170 258 C184 264 208 264 222 254" fill="none" stroke="#e0a894" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </g>
    <g transform="translate(318 244) scale(1.28) translate(-318 -234)">
      <path d="M284 232 C296 202 342 204 352 236 C344 262 290 262 284 232 Z" fill="#ffffff"/>
      <ellipse cx="318" cy="234" rx="25" ry="23" fill="url(#iris)"/>
      <ellipse cx="318" cy="238" rx="12" ry="12" fill="#140b08"/>
      <circle cx="308" cy="224" r="8" fill="#ffffff"/>
      <circle cx="327" cy="245" r="4" fill="#ffffff" opacity="0.9"/>
      <path d="M282 226 C300 206 338 208 356 232" fill="none" stroke="#1c1620" stroke-width="5" stroke-linecap="round"/>
      <path d="M352 226 l10 -1" stroke="#1c1620" stroke-width="5" stroke-linecap="round"/>
      <path d="M290 254 C304 262 328 262 342 254" fill="none" stroke="#e0a894" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- nose -->
    <path d="M252 296 C256 300 262 300 264 296" fill="none" stroke="#e7a58d" stroke-width="4" stroke-linecap="round"/>

    <!-- pouty kiss lips -->
    <g>
      <ellipse cx="258" cy="336" rx="24" ry="20" fill="url(#lip)"/>
      <path d="M240 334 C250 328 266 328 276 334" fill="none" stroke="#c9405c" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="268" cy="346" rx="6" ry="3.5" fill="#ffffff" opacity="0.7"/>
      <ellipse cx="248" cy="324" rx="4" ry="2.5" fill="#ffffff" opacity="0.6"/>
    </g>
    <!-- hearts floating off the kiss -->
    <path d="M30 214 c0 -10 15 -13 18 -3 c3 -10 18 -7 18 3 c0 13 -18 20 -18 23 c0 -3 -18 -10 -18 -23z" fill="#ff5d7a"/>
    <path d="M448 188 c0 -6 9 -8 11 -2 c2 -6 11 -4 11 2 c0 8 -11 12 -11 14 c0 -2 -11 -6 -11 -14z" fill="#ff8aa0"/>

    <!-- side hair falling over the cheeks -->
    <path d="M106 150 C84 230 92 320 116 392 L138 392 C118 320 116 240 134 170 Z" fill="url(#hair)"/>
    <path d="M406 150 C428 230 420 320 396 392 L374 392 C394 320 396 240 378 170 Z" fill="url(#hair)"/>

    <!-- blunt, choppy bangs -->
    <path d="M112 196 C112 110 180 64 256 64 C332 64 400 110 400 196
             L386 200 L374 176 L362 206 L346 180 L334 204 L316 172 L302 200 L290 178 L276 204
             L262 174 L248 202 L234 176 L222 206 L206 178 L194 204 L178 176 L166 202 L150 178 L138 204 L126 186 Z"
          fill="url(#hair)"/>
    <!-- one stray lock across the face, like in the photo -->
    <path d="M262 176 C266 210 262 236 250 262" fill="none" stroke="#1c1620" stroke-width="4" stroke-linecap="round"/>
    <!-- hair shine -->
    <path d="M170 110 C200 92 240 86 270 90" fill="none" stroke="#6b5a70" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <path d="M296 94 C320 98 338 106 350 116" fill="none" stroke="#6b5a70" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
