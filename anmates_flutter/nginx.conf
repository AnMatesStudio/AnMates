server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend through Docker's embedded DNS at request time.
    # Using a variable (a) lets us target the compose SERVICE name ("api" —
    # the container is "anmates-api-1", so the literal name "anmates-api"
    # never resolves) and (b) lets nginx start even when the api container
    # is not up yet — it returns 502 and self-heals instead of dying at
    # startup with "host not found in upstream" and crash-looping.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # SPA fallback so Flutter web routing works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /health is registered directly on the Fiber app, outside the /api/v1 group —
    # proxy it explicitly so an external healthcheck through the public hostname works.
    location = /health {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Reverse-proxy to the api Service — internal only, no public hostname for it
    # (2026-09-01 MVP decision: single public hostname, API reached via CoreDNS).
    # Service name must match deploy/charts/anmates values.yaml api.serviceName.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket chat — same backend, needs the Upgrade/Connection handshake headers
    # and a long read timeout since chat connections stay open.
    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Static assets — 2h, which is also Cloudflare's own default TTL for a
    # cacheable 200, so the edge behaves the same with or without this header.
    #
    # Deliberately NOT `immutable`, and deliberately not 30d: `flutter build web`
    # puts no content hash in any filename — main.dart.js, flutter_bootstrap.js
    # and every asset keep the same name on every build. `immutable` tells caches
    # never to revalidate, not even on a reload, so the old bundle stayed frozen
    # at Cloudflare's edge and deploys were invisible until a manual Purge
    # Everything (2026-09-02). Worst case now is 2h, or one purge to skip it.
    #
    # `expires` is left out on purpose: it emits a Cache-Control of its own, so
    # pairing it with add_header would send the field twice.
    #
    # Do not add `json` here: regex locations outrank the /api/ prefix above, so
    # any API path ending in a listed extension would be served off disk instead
    # of proxied.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|wasm)$ {
        add_header Cache-Control "public, max-age=7200";
    }

    # Entry point is never cached so a new build is always discovered. On its own
    # that guarantees nothing: index.html only points at flutter_bootstrap.js,
    # which points at main.dart.js — both capped by the 2h above.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm image/svg+xml;
    gzip_min_length 1024;
}
