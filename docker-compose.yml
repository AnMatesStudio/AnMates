# Full-stack dev environment for AnMates: Flutter web + Go API + Postgres.
# Reads ./env at repository root (see .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: anmates
    ports:
      - "5432:5432"
    command: >
      postgres -c shared_buffers=64MB -c effective_cache_size=256MB
               -c work_mem=2MB -c max_connections=20
               -c log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anmates"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ./anmates-api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    env_file: .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      # AI Concierge venue source = the ai-venue-search sidecar (MCP web-search).
      # Takes precedence over AI_BASE_URL (legacy DB+LLM) when set. Reachable on the
      # compose network by service name. Override/empty in .env to fall back.
      AI_SEARCH_URL: ${AI_SEARCH_URL-http://ai_venue_search:8090}
    depends_on:
      db:
        condition: service_healthy
      ai_venue_search:
        condition: service_healthy
    healthcheck:
      # --spider just probes the URL (no body download) — most reliable across
      # busybox/full wget builds. Use 127.0.0.1, NOT localhost: busybox wget
      # resolves "localhost" to IPv6 ::1 first, but the Go server listens on IPv4
      # only → "connection refused" → container stuck "unhealthy" forever.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # AI venue-search sidecar. FREE defaults, no keys: DuckDuckGo MCP web-search +
  # Pollinations structurer. See ai-venue-search/README.md. Override any of the
  # provider env vars here or in .env to switch to LM Studio / Anthropic / Brave.
  ai_venue_search:
    build:
      context: ./ai-venue-search
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-mcp}
      MCP_SERVER_CMD: ${MCP_SERVER_CMD:-uvx duckduckgo-mcp-server}
      MCP_FETCH_TOP_N: ${MCP_FETCH_TOP_N:-2}
      GEOCODE_ENABLED: ${GEOCODE_ENABLED:-1}
      # Default = the bundled `ollama` container → the structurer LLM runs fully
      # in Docker (no host model, no cloud). Set STRUCTURER=pollinations to use the
      # keyless cloud structurer instead.
      STRUCTURER: ${STRUCTURER:-openai}
      POLLINATIONS_MODEL: ${POLLINATIONS_MODEL:-openai}
      POLLINATIONS_TOKEN: ${POLLINATIONS_TOKEN:-}
      # Structurer LLM endpoint. Defaults to the in-Docker `ollama` service. Override
      # to point elsewhere, e.g. host LM Studio at http://host.docker.internal:1234/v1.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      # Ollama model tag (single source of truth, shared with the ollama_pull job).
      LLM_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    extra_hosts:
      # Lets LLM_BASE_URL still reach a model on the host if you override it.
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8090/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Local LLM for the venue-search structurer — keeps the whole AI path inside
  # Docker (no host LM Studio, no cloud). Exposes an OpenAI-compatible API at
  # /v1, which the sidecar's STRUCTURER=openai path consumes. CPU by default;
  # for GPU, run via start.sh with OLLAMA_GPU=1 (merges docker-compose.gpu.yml).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      # `ollama list` succeeds only once the embedded server is accepting requests.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot job: pulls the structurer model into the shared ollama volume, then
  # exits. Idempotent (a no-op once cached). Uses OLLAMA_HOST so the CLI drives the
  # `ollama` server container instead of a local one. First run downloads ~2GB.
  ollama_pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flutter_web:
    build:
      context: ./anmates_flutter
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://127.0.0.1:8080}
    restart: unless-stopped
    ports:
      - "0.0.0.0:${FLUTTER_WEB_PORT:-54180}:80"
    # nginx serves a static SPA — it doesn't talk to the API at startup, the
    # browser does. So we only wait for api to *start* (not be healthy);
    # otherwise a flaky api healthcheck blocks the web container forever.
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  ollama:
