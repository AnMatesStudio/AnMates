name: CD · AI Venue Search → Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'ai-venue-search/**'
      - '.github/workflows/cd.ai-venue-search.yml'
  workflow_dispatch:

concurrency:
  group: cd.ai-venue-search-main
  cancel-in-progress: false

env:
  GCP_PROJECT: anmates-studio
  GCP_REGION: asia-southeast1
  SERVICE_NAME: ai-venue-search
  AR_REPO: anmates-api          # reuse the existing Artifact Registry repo
  AR_IMAGE: ai-venue-search

jobs:
  deploy:
    name: Build + Deploy Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://ai-venue-search-492509819332.asia-southeast1.run.app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (validate + test)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps + test
        working-directory: ai-venue-search
        run: |
          pip install -r requirements.txt pytest
          # Mock providers run fully offline — no network / API keys needed.
          pytest -q

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build + push image
        id: build
        working-directory: ai-venue-search
        run: |
          # Build on the runner and push straight to Artifact Registry (same rationale
          # as cd.go-api.yml — `gcloud builds submit` needs Viewer/Owner to tail logs).
          AR_BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.AR_IMAGE }}"
          IMAGE_TAG="${AR_BASE}:${{ github.sha }}"
          IMAGE_LATEST="${AR_BASE}:latest"
          docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
          docker push "$IMAGE_TAG"
          docker push "$IMAGE_LATEST"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Capture previous Cloud Run revision (for rollback)
        id: prev
        run: |
          PREV=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format="value(status.latestReadyRevisionName)" 2>/dev/null || echo "")
          echo "prev_revision=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous revision: $PREV"

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          # 1Gi/120s headroom: each /suggest spawns the DuckDuckGo MCP subprocess,
          # fetches pages, then calls Pollinations (free, ~1 req/15s anon).
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ steps.build.outputs.image_tag }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8090 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 120 \
            --revision-suffix "sha-${GITHUB_SHA::7}" \
            --set-env-vars "STRUCTURER=pollinations" \
            --set-env-vars "GEOCODE_ENABLED=1" \
            --quiet

      - name: Smoke check /health
        id: smoke
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --format="value(status.url)")
          echo "Service URL: $URL"
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
            if [ "$status" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: got $status, retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 6 attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'success' && steps.prev.outputs.prev_revision != ''
        run: |
          echo "::warning::Deploy succeeded but smoke check failed. Rolling back to ${{ steps.prev.outputs.prev_revision }}"
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --to-revisions=${{ steps.prev.outputs.prev_revision }}=100 \
            --quiet
