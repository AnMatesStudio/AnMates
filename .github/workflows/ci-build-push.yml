name: CI · Build + Push (GHCR) — MVP 1 ngày

# Test + build + push image lên GHCR. KHÔNG deploy tự động — deploy là bước thủ công
# trên PC host theo plan docs/plans/2026-09-01-mvp-1day-onprem-k8s.md (H5):
#   helm upgrade --install anmates ./deploy/charts/anmates -n anmates \
#     -f deploy/charts/anmates/values-prod.yaml \
#     --set image.owner=<owner> --set image.api.tag=<sha> --set image.web.tag=<sha> \
#     --atomic --wait --timeout 10m
#
# Chỉ cần 1 GH secret: GOONG_MAPTILES_KEY. Đăng nhập GHCR dùng GITHUB_TOKEN có sẵn,
# không cần secret riêng nào cho registry.

on:
  push:
    branches: [main]
    paths:
      - 'anmates-api/**'
      - 'anmates_flutter/**'
      - '.github/workflows/ci-build-push.yml'
  workflow_dispatch:

concurrency:
  group: ci-build-push-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  test-api:
    name: Go API — vet + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: anmates-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: anmates-api/go.mod
          cache: true
          cache-dependency-path: anmates-api/go.sum
      - name: go vet + test
        run: |
          go vet ./...
          # loại smoke/ — bộ đó gọi server thật, không chạy trong CI
          go test -race -count=1 $(go list ./... | grep -v '/smoke$')

  test-web:
    name: Flutter web — analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: anmates_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --reporter=expanded

  build-push-api:
    name: Build + push anmates-api
    needs: test-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image owner (GHCR yêu cầu tên repo viết thường)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./anmates-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/anmates-api:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/anmates-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-push-web:
    name: Build + push anmates-web
    needs: test-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lowercase image owner (GHCR yêu cầu tên repo viết thường)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./anmates_flutter
          push: true
          # API_BASE_URL = domain của CHÍNH web app (same-origin) — nginx trong image
          # web proxy /api/* + /ws/* vào Service api nội bộ. KHÔNG dùng api.<domain>.
          # Set biến ANMATES_DOMAIN trong repo Settings → Actions → Variables.
          build-args: |
            API_BASE_URL=https://${{ vars.ANMATES_DOMAIN }}
            GOONG_MAPTILES_KEY=${{ secrets.GOONG_MAPTILES_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/anmates-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/anmates-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: In lệnh deploy
    needs: [build-push-api, build-push-web]
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase image owner (GHCR yêu cầu tên repo viết thường)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - run: |
          echo "::notice::Image đã lên GHCR. Chạy lệnh sau TRÊN PC HOST để deploy:"
          echo "::notice::helm upgrade --install anmates ./deploy/charts/anmates -n anmates -f deploy/charts/anmates/values-prod.yaml --set image.owner=${{ env.IMAGE_OWNER }} --set image.api.tag=${{ github.sha }} --set image.web.tag=${{ github.sha }} --atomic --wait --timeout 10m"
