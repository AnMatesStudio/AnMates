name: CI · Flutter Web

on:
  pull_request:
    branches: [main]
    paths:
      - 'anmates_flutter/**'
      - '.github/workflows/ci.flutter-web.yml'

concurrency:
  group: ci.flutter-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: anmates_flutter

jobs:
  analyze-test-build:
    name: Analyze + Test + Build web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build-success: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: dart format check
        run: dart format --output=none .

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test --reporter=expanded

      # Bake the shared dev API base URL into the bundle so the PR build hits the
      # live dev Cloud Run backend (https://anmates-api-...run.app). Override via
      # the repo variable API_BASE_URL when the URL changes.
      - name: flutter build web
        id: build
        run: |
          flutter build web --release \
            --base-href / \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://anmates-api-492509819332.asia-southeast1.run.app' }} \
            --dart-define=GOONG_MAPTILES_KEY=${{ secrets.GOONG_MAPTILES_KEY }}

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-${{ github.run_id }}
          path: anmates_flutter/build/web
          retention-days: 7

  # Deploy the PR build to the shared `dev` environment so reviewers/devs can test
  # the branch directly at https://dev-anmates-studio.web.app. Skipped on fork PRs
  # (they cannot access deploy secrets — by design).
  deploy-dev:
    name: Deploy → dev (Firebase Hosting)
    runs-on: ubuntu-latest
    needs: analyze-test-build
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: dev
      url: https://dev-anmates-studio.web.app
    steps:
      - uses: actions/checkout@v4

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-${{ github.run_id }}
          path: anmates_flutter/build/web

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to dev-anmates-studio.web.app
        working-directory: anmates_flutter
        run: |
          firebase target:apply hosting dev dev-anmates-studio \
            --project anmates-studio
          firebase deploy --only hosting:dev \
            --project anmates-studio \
            --non-interactive

      - name: Comment dev URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://dev-anmates-studio.web.app';
            const api = 'https://anmates-api-492509819332.asia-southeast1.run.app';
            const body = [
              `🚀 **Dev deployed** — test this branch live:`,
              ``,
              `- Web: ${url}`,
              `- API: \`${api}\``,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('🚀 **Dev deployed**'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
