name: CI · Flutter Web

on:
  pull_request:
    branches: [main]
    paths:
      - 'anmates_flutter/**'
      - '.github/workflows/ci.flutter-web.yml'

concurrency:
  group: ci.flutter-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: anmates_flutter

jobs:
  analyze-test-build:
    name: Analyze + Test + Build web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter --version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: dart format check
        run: dart format --output=none .

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: flutter test --reporter=expanded

      # API_BASE_URL = domain của chính web app (same-origin) — nginx trong image
      # proxy /api/* + /ws/* vào Service api nội bộ. Khớp với ci-build-push.yml.
      # Chỉ để verify build thành công trên PR, không deploy.
      - name: flutter build web
        id: build
        run: |
          flutter build web --release \
            --base-href / \
            --dart-define=API_BASE_URL=https://${{ vars.ANMATES_DOMAIN }} \
            --dart-define=GOONG_MAPTILES_KEY=${{ secrets.GOONG_MAPTILES_KEY }}

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-${{ github.run_id }}
          path: anmates_flutter/build/web
          retention-days: 7
