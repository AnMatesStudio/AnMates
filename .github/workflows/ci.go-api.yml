name: CI · Go API

on:
  pull_request:
    branches: [main]
    paths:
      - 'anmates-api/**'
      - '.github/workflows/ci.go-api.yml'

concurrency:
  group: ci.go-api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: anmates-api

jobs:
  lint-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: anmates-api/go.mod
          cache: true
          cache-dependency-path: anmates-api/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: anmates-api
          args: --timeout=3m

      - name: go build
        run: go build ./...

      - name: go test
        run: |
          # Exclude smoke/ — that suite hits a live server, not for CI.
          go test -race -count=1 $(go list ./... | grep -v '/smoke$')

  # Required, secret-free gate: verifies the Dockerfile builds on every PR
  # (incl. forks). This is the branch-protection check — it never deploys.
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (verify Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: ./anmates-api
          file: ./anmates-api/Dockerfile
          push: false
          tags: anmates-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy the PR's backend to the shared `dev` Cloud Run so the branch can be
  # tested end-to-end against the live dev API. Same-repo PRs only (needs secrets).
  # NOTE (transitional): dev and production currently share ONE Cloud Run service
  # (`anmates-api`) — this deploy shifts 100% traffic to the PR revision. See
  # WORKFLOW-ARCHITECTURE.md "Dev environment (transitional)" for the planned split
  # to a dedicated production service + Cloud SQL.
  deploy-dev:
    name: Deploy → dev (Cloud Run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-test
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    environment:
      name: dev
      url: https://anmates-api-492509819332.asia-southeast1.run.app
    env:
      GCP_PROJECT: anmates-studio
      GCP_REGION: asia-southeast1
      SERVICE_NAME: anmates-api
      AR_REPO: anmates-api
      AR_IMAGE: api
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build + push image
        id: build
        working-directory: anmates-api
        run: |
          # Build on the runner + push straight to Artifact Registry (same rationale
          # as cd.go-api.yml — `gcloud builds submit` needs Viewer/Owner to tail logs).
          AR_BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.AR_IMAGE }}"
          IMAGE_TAG="${AR_BASE}:dev-${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run (dev)
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ steps.build.outputs.image_tag }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --timeout 3600 \
            --set-env-vars "ENV=dev" \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars "FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}" \
            --set-env-vars "AI_SEARCH_URL=${{ vars.AI_SEARCH_URL || 'https://ai-venue-search-492509819332.asia-southeast1.run.app' }}" \
            --quiet

      - name: Smoke check /health
        run: |
          URL="https://anmates-api-492509819332.asia-southeast1.run.app"
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health")
            if [ "$status" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: got $status, retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 6 attempts"
          exit 1
