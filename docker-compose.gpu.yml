# ─────────────────────────────────────────────────────────────────────────────
# Optional GPU override for the bundled Ollama LLM.
#
# Kept OUT of the base docker-compose.yml on purpose: requesting an NVIDIA device
# makes `docker compose up` fail on machines without the NVIDIA Container Toolkit.
# So GPU is opt-in.
#
#   start.sh:        OLLAMA_GPU=1 ./start.sh
#   manual compose:  docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# Requires: an NVIDIA GPU + driver, and the NVIDIA Container Toolkit wired into the
# Docker runtime (Docker Desktop WSL2 GPU support, or nvidia-container-toolkit on
# Linux). With GPU you can comfortably bump to a larger model, e.g.
#   OLLAMA_MODEL=qwen2.5:7b OLLAMA_GPU=1 ./start.sh
# ─────────────────────────────────────────────────────────────────────────────
services:
  ollama:
    # NVIDIA_VISIBLE_DEVICES + NVIDIA_DRIVER_CAPABILITIES are the legacy env-var
    # knobs recognised by the NVIDIA container runtime (needed on some Docker
    # Desktop / WSL2 setups even when deploy.resources is present).
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
